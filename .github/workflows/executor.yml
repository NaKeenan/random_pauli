name: Parallel Simulations

on:
  workflow_dispatch:
    inputs:
      N:
        description: Number of qubits
        default: 14
        type: number
      T:
        description: Time to run
        default: 1000
        type: number
      circuit_realizations:
        description: Total circuit realizations (cr dimension)
        default: 10
        type: number
      L:
        description: Grid resolution (L x L for Jx x Jz)
        default: 3
        type: number
      batch_size:
        description: Number of (cr,ix,iz) points per job
        default: 5
        type: number

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make-matrix.outputs.matrix }}
    steps:
      - name: Calculate batch matrix
        id: make-matrix
        run: |
          # read inputs
          N=${{ github.event.inputs.N }}
          CR=${{ github.event.inputs.circuit_realizations }}
          L=${{ github.event.inputs.L }}
          b=${{ github.event.inputs.batch_size }}

          # build full list of points (cr, ix, iz)
          pts=()
          for cr in $(seq 0 $((CR-1))); do
            for ix in $(seq 0 $((L-1))); do
              for iz in $(seq 0 $((L-1))); do
                pts+=( "{\"cr\":$cr,\"ix\":$ix,\"iz\":$iz}" )
              done
            done
          done

          # chunk into batches of size b
          total=${#pts[@]}
          M=$(( (total + b - 1) / b ))

          matrix="["
          for i in $(seq 0 $((M-1))); do
            start=$(( i * b ))
            end=$(( start + b - 1 ))
            if [ $end -ge $((total-1)) ]; then end=$((total-1)); fi

            batch_pts="["
            for j in $(seq $start $end); do
              batch_pts+="${pts[j]}"
              if [ $j -lt $end ]; then batch_pts+=','; fi
            done
            batch_pts+="]"

            matrix+="{\"batch_index\":$i,\"points\":$batch_pts}"
            if [ $i -lt $((M-1)) ]; then matrix+=','; fi
          done
          matrix+="]"

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  run-batch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 -m pip install --upgrade pip
          pip install quspin numpy scipy tqdm sympy imageio psutil

      - name: Debug – Show batch info
        run: |
          echo "Batch index: ${{ matrix.batch_index }}"
          echo "Points JSON : ${{ matrix.points }}"

      - name: Run single_run.py for batch
        working-directory: python_statevector_simulation
        run: |
          # expand JSON list of points into CLI flags
          POINT_FLAGS=""
          for p in $(echo '${{ matrix.points }}' | jq -c '.[]'); do
            cr=$(echo $p | jq '.cr')
            ix=$(echo $p | jq '.ix')
            iz=$(echo $p | jq '.iz')
            POINT_FLAGS+=" --point $cr $ix $iz"
          done

          python single_run.py \
            --N ${{ github.event.inputs.N }} \
            --T ${{ github.event.inputs.T }} \
            --circuit-realizations ${{ github.event.inputs.circuit_realizations }} \
            --L ${{ github.event.inputs.L }} \
            --params-path ../random_archive/angles_N${{ github.event.inputs.N }}.json \
            --output-magic results/magic/N${{ github.event.inputs.N }}/T${{ github.event.inputs.T }} \
            --output-entanglement results/entanglement/N${{ github.event.inputs.N }}/T${{ github.event.inputs.T }} \
            $POINT_FLAGS

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-batch-${{ matrix.batch_index }}
          path: python_statevector_simulation/results/
